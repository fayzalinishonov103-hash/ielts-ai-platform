{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto my-10 bg-slate-900/50 backdrop-blur-xl border border-white/10 p-8 rounded-3xl shadow-2xl space-y-6">
    <div class="text-center space-y-2">
        <h1 class="text-2xl font-black text-white">Ro'yxatdan o'tish</h1>
        <p class="text-xs text-gray-400">CEFR AI platformasida o'z profilingizni yarating</p>
    </div>

    <form action="/register" method="POST" class="space-y-4" autocomplete="off">
        <div>
            <label class="block text-xs font-semibold text-gray-300 mb-1">To'liq ism-familiya</label>
            <input type="text" name="name" placeholder="Falonchi Falonchiyev" required
                   class="w-full bg-slate-950/60 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500 transition">
        </div>

        <div>
            <label class="block text-xs font-semibold text-gray-300 mb-1">Foydalanuvchi nomi (Username)</label>
            <input type="text" name="username" autocomplete="off" placeholder="username" required
                   class="w-full bg-slate-950/60 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500 transition">
        </div>

        <div class="grid grid-cols-2 gap-3">
            <div>
                <label class="block text-xs font-semibold text-gray-300 mb-1">Tug'ilgan sana</label>
                <input type="text" name="birth_date" placeholder="KK.OO.YYYY" required
                       class="w-full bg-slate-950/60 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500 transition">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-300 mb-1">Yashash manzili</label>
                <input type="text" name="address" placeholder="Shahar / Tuman" required
                       class="w-full bg-slate-950/60 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500 transition">
            </div>
        </div>

        <div>
            <label class="block text-xs font-semibold text-gray-300 mb-1">Universitet / O'quv yurti <span class="text-gray-500 font-normal">(ixtiyoriy)</span></label>
            <input type="text" name="university" placeholder="Andijan State Technical University"
                   class="w-full bg-slate-950/60 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500 transition">
        </div>

        <!-- CEFR Darajasini tanlash -->
        <div>
            <label class="block text-xs font-semibold text-gray-300 mb-1">O'zingizning CEFR darajangiz</label>
            <select name="level" required
                    class="w-full bg-slate-950/60 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500 transition">
                <option value="A2" class="bg-slate-900 text-white">A2 - Elementary</option>
                <option value="B1" class="bg-slate-900 text-white">B1 - Intermediate</option>
                <option value="B2" selected class="bg-slate-900 text-white">B2 - Upper-Intermediate (Standart)</option>
                <option value="C1" class="bg-slate-900 text-white">C1 - Advanced</option>
            </select>
        </div>

        <div>
            <label class="block text-xs font-semibold text-gray-300 mb-1">Parol</label>
            <input type="password" name="password" placeholder="••••••••" autocomplete="new-password" required
                   class="w-full bg-slate-950/60 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500 transition">
        </div>

        <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3.5 rounded-xl text-sm transition shadow-lg shadow-emerald-500/20">
            Ro'yxatdan o'tish
        </button>
    </form>

    <p class="text-center text-xs text-gray-400">
        Hisobingiz bormi? <a href="/login" class="text-emerald-400 font-semibold hover:underline">Kirish</a>
    </p>
</div>
<script>
    const birthInput = document.querySelector('input[name="birth_date"]');
    if (birthInput) {
        birthInput.addEventListener('input', function (e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length > 2 && value.length <= 4) {
                value = value.slice(0, 2) + '.' + value.slice(2);
            } else if (value.length > 4) {
                value = value.slice(0, 2) + '.' + value.slice(2, 4) + '.' + value.slice(4, 8);
            }
            e.target.value = value;
        });
    }
</script>
{% endblock %}
