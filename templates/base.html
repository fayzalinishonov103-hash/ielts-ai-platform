<!DOCTYPE html>
<html lang="uz">
<head>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEFR AI Platformasi</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-gray-100 min-h-screen flex flex-col justify-between font-sans selection:bg-emerald-500 selection:text-slate-950">

    <!-- Navbar / Yuqori menyu -->
    <header class="border-b border-gray-800 bg-gray-900/50 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 md:px-6 h-16 flex items-center justify-between flex-wrap">
            <!-- Logo -->
            <a href="/" class="text-lg md:text-xl font-black tracking-wider text-emerald-400 flex items-center space-x-2">
                <span>🚀 CEFR AI</span>
            </a>

            <!-- Menyu havolalari (Telefonda kichikroq, noutbukda kattaroq va qulay) -->
            <nav class="flex items-center space-x-3 md:space-x-6 text-xs md:text-sm font-semibold overflow-x-auto py-2">
                <a href="/reading" class="hover:text-emerald-400 transition whitespace-nowrap">Reading</a>
                <a href="/listening" class="hover:text-emerald-400 transition whitespace-nowrap">Listening</a>
                <a href="/writing" class="hover:text-emerald-400 transition whitespace-nowrap">Writing</a>
                <a href="/speaking" class="hover:text-emerald-400 transition whitespace-nowrap">Speaking</a>
                <a href="/profile" class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-3 py-1.5 md:px-4 md:py-2 rounded-xl hover:bg-emerald-500/20 transition whitespace-nowrap">Profil</a>
            </nav>
        </div>
    </header>

    <!-- Asosiy kontent qismi -->
    <main class="max-w-7xl mx-auto px-4 md:px-6 py-6 md:py-8 flex-grow w-full">
        {% block content %}{% endblock %}
    </main>

    <!-- Pastki qism (Footer) -->
    <footer class="border-t border-gray-800 bg-gray-900/30 text-center py-6 text-xs text-gray-500">
        <p>&copy; 2026 CEFR AI Platformasi. Barcha huquqlar himoyalangan.</p>
    </footer>

</body>
</html>
