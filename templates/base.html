<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CEFR & IELTS Platformasi{% endblock %}</title>

    <!-- Montserrat Shrifti -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Asosiy Stillar va Montserrat'ni majburiy qilish -->
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #FAF8F5;
            color: #1c1917;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #FAF8F5;
        }
        ::-webkit-scrollbar-thumb {
            background: #d6d3d1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a8a29e;
        }
    </style>

    {% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen flex flex-col selection:bg-amber-700 selection:text-white">

    <!-- Navbar / Header (Agar sahifada umumiy header kerak bo'lsa) -->
    <header class="w-full border-b border-stone-200 bg-[#FAF8F5]/80 backdrop-blur-md sticky top-0 z-50 px-6 py-4">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <a href="/" class="text-xl font-black tracking-tight text-stone-900 flex items-center gap-2">
                <span class="w-3 h-3 bg-amber-700 rounded-full"></span>
                CEFR Platform FR∞
            </a>
            <nav class="hidden md:flex items-center gap-8 text-sm font-semibold text-stone-600">
                <a href="/reading" class="hover:text-stone-900 transition">Reading</a>
                <a href="/listening" class="hover:text-stone-900 transition">Listening</a>
                <a href="/writing" class="hover:text-stone-900 transition">Writing</a>
                <a href="/speaking" class="hover:text-stone-900 transition">Speaking</a>
            </nav>
            <div class="flex items-center gap-4">
                <a href="/profile" class="text-sm font-bold px-4 py-2 bg-stone-900 text-white rounded-2xl hover:bg-stone-800 transition shadow-sm">
                    Kabinet
                </a>
            </div>
        </div>
    </header>

    <!-- Asosiy Kontent Maydoni -->
    <main class="flex-grow max-w-7xl w-full mx-auto p-6">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="w-full border-t border-stone-200 py-6 text-center text-xs font-medium text-stone-500 bg-[#FAF8F5]">
        <p>&copy; 2026 CEFR & IELTS AI Platformasi. Barcha huquqlar himoyalangan.</p>
    </footer>

</body>
</html>
