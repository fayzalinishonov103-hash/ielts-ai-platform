{% extends "base.html" %}
{% block content %}
<div class="max-w-4xl mx-auto space-y-6 pb-12">
    <!-- Orqaga qaytish va Sarlavha -->
    <div class="flex justify-between items-center border-b border-stone-300/80 pb-4">
        <a href="/writing" class="text-amber-700 hover:text-amber-800 text-sm font-semibold transition">&larr; Writing mavzulariga qaytish</a>
        <span class="text-xs font-bold px-3 py-1 rounded-xl bg-amber-100 text-amber-800 border border-amber-200">Writing Task - Mavzu #{{ topic.id }}</span>
    </div>

    <!-- Mavzu va Ko'rsatma bloki -->
    <div class="bg-[#FAF8F5]/80 backdrop-blur-md border border-stone-300/80 p-6 md:p-8 rounded-3xl shadow-xl space-y-3">
        <h1 class="text-2xl font-black text-stone-900">{{ topic.title }}</h1>
        <div class="p-5 bg-white rounded-2xl border border-stone-300/80 text-stone-700 text-sm leading-relaxed shadow-sm">
            <strong class="text-amber-800 block mb-1 uppercase tracking-wider text-xs">Topshiriq / Ko'rsatma:</strong>
            {{ topic.prompt_text }}
        </div>

        <!-- AI Yordamchi tugmasi -->
        <div class="pt-2">
            <button onclick="getAiHelp()" class="bg-amber-100/80 hover:bg-amber-200 text-amber-800 border border-amber-300 font-bold px-5 py-3 rounded-2xl text-sm transition flex items-center space-x-2 shadow-sm">
                <span>💡 AI Yordamchi (Reja va Kalit so'zlar so'rash)</span>
            </button>
        </div>
    </div>

    <!-- AI Yordamchi Natijasi -->
    <div id="ai-help-box" class="hidden bg-white border border-amber-700/30 p-6 md:p-8 rounded-3xl shadow-xl space-y-3">
        <h3 class="text-lg font-black text-amber-800">🤖 AI Ekspert Maslahatlari:</h3>
        <div id="ai-help-content" class="text-stone-700 text-sm whitespace-pre-line leading-relaxed bg-[#FAF8F5] p-5 rounded-2xl border border-stone-300/80"></div>
    </div>

    <!-- Esse yozish maydoni -->
    <div class="bg-[#FAF8F5]/80 backdrop-blur-md border border-stone-300/80 p-6 md:p-8 rounded-3xl shadow-xl space-y-4">
        <label class="block text-sm font-bold text-stone-900">Esseingizni yozing:</label>
        <textarea id="essay-text" rows="10" oninput="updateWordCount()" placeholder="Write your essay here..." class="w-full bg-white border border-stone-300 rounded-2xl p-4 text-stone-900 text-sm focus:outline-none focus:border-amber-700 transition leading-relaxed shadow-sm"></textarea>

        <div class="flex justify-between items-center pt-2 flex-wrap gap-4">
            <span id="word-count" class="text-xs font-bold text-stone-600 uppercase tracking-wider">So'zlar soni: 0</span>
            <button onclick="checkWriting()" class="bg-stone-900 hover:bg-stone-800 text-white font-bold px-6 py-3 rounded-2xl text-sm transition shadow-md">
                Tahlil qilish
            </button>
        </div>
    </div>

    <!-- AI Tahlil / Natija qismi -->
    <div id="feedback-box" class="hidden bg-white border border-emerald-500/30 p-6 md:p-8 rounded-3xl shadow-2xl space-y-4">
        <h3 class="text-lg font-black text-emerald-800">🤖 AI Ekspert Tahlili va Bahosi:</h3>
        <div id="feedback-content" class="text-stone-700 text-sm whitespace-pre-line leading-relaxed bg-[#FAF8F5] p-5 rounded-2xl border border-stone-300/80"></div>
    </div>
</div>

<script>
function updateWordCount() {
    const text = document.getElementById('essay-text').value.trim();
    const words = text === "" ? 0 : text.split(/\s+/).length;
    document.getElementById('word-count').innerText = "So'zlar soni: " + words;
}

async function getAiHelp() {
    const helpBox = document.getElementById('ai-help-box');
    const helpContent = document.getElementById('ai-help-content');

    helpBox.classList.remove('hidden');
    helpContent.innerText = "AI siz uchun mavzu bo'yicha reja va foydali so'zlarni tayyorlamoqda...";

    try {
        const response = await fetch('/api/ai-helper', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                text_content: "{{ topic.title }} - {{ topic.prompt_text }}",
                module_type: "Writing"
            })
        });
        const data = await response.json();

        if (response.ok) {
            helpContent.innerText = data.ai_help;
        } else {
            helpContent.innerText = "Xatolik yuz berdi.";
        }
    } catch (err) {
        helpContent.innerText = "Server bilan aloqa yo'q.";
    }
}

async function checkWriting() {
    const essayText = document.getElementById('essay-text').value.trim();
    const feedbackBox = document.getElementById('feedback-box');
    const feedbackContent = document.getElementById('feedback-content');

    if (!essayText) {
        alert("Iltimos, avval essengizni yozing!");
        return;
    }

    feedbackBox.classList.remove('hidden');
    feedbackContent.innerText = "AI esseingizni tahlil qilmoqda, iltimos kuting...";

    try {
        const response = await fetch('/check-writing', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ essay_text: essayText })
        });
        const data = await response.json();

        if (response.ok) {
            feedbackContent.innerText = data.feedback;
        } else {
            feedbackContent.innerText = "Xatolik yuz berdi.";
        }
    } catch (err) {
        feedbackContent.innerText = "Server bilan aloqa yo'q.";
    }
}
</script>
{% endblock %}
