{% extends "base.html" %}
{% block content %}
<div class="space-y-6 max-w-4xl mx-auto pb-12">
    <!-- Yuqori sarlavha -->
    <div class="border-b border-stone-300/80 pb-6">
        <h2 class="text-3xl font-black text-stone-900 tracking-tight">Foydalanish Tarixi</h2>
        <p class="text-stone-600 mt-2 text-sm">Oldingi ishlagan testlaringiz va tahlillaringiz.</p>
    </div>

    <!-- Bo'sh holat kartochkasi -->
    <div class="bg-[#FAF8F5]/80 backdrop-blur-md border border-stone-300/80 rounded-3xl p-10 text-center text-stone-500 shadow-xl">
        <div class="w-12 h-12 rounded-2xl bg-stone-200/80 flex items-center justify-center mx-auto mb-4 text-stone-700 font-bold">
            ⏳
        </div>
        <p class="text-stone-700 font-semibold text-sm">Hozircha saqlangan tarix ma'lumotlari mavjud emas.</p>
        <p class="text-stone-400 text-xs mt-1">Mashqlarni bajarib boring, natijalaringiz shu yerda ko'rinib boradi.</p>
    </div>
</div>
{% endblock %}
