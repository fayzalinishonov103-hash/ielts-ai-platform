<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>{{ item.title }} - Listening Moduli</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-gray-100 min-h-screen p-6 font-sans">
    <div class="max-w-3xl mx-auto space-y-6">
        <!-- Yuqori qism / Orqaga qaytish -->
        <div class="flex justify-between items-center border-b border-gray-800 pb-4">
            <a href="/listening" class="text-indigo-400 hover:text-indigo-300 text-sm font-semibold transition">&larr; Listening ro'yxatiga qaytish</a>
            <span class="text-xs font-bold px-3 py-1 rounded-full bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">Listening Item {{ item.id }}</span>
        </div>

        <div class="bg-gray-900/80 border border-gray-800 p-8 rounded-2xl shadow-2xl space-y-6">
            <h1 class="text-2xl font-black text-white">{{ item.title }}</h1>

            <!-- Audio pleer va Tezlik boshqaruvi -->
            <div class="bg-slate-950 p-6 rounded-xl border border-gray-800 space-y-4">
                <div class="flex items-center justify-between">
                    <span class="text-sm font-bold text-indigo-400">🎧 Ovozli matnni tinglash:</span>
                    <!-- Tezlikni boshqarish tugmalari -->
                    <div class="flex gap-1 bg-slate-900 p-1 rounded-lg border border-gray-800 text-xs">
                        <button onclick="setPlaybackRate(0.75)" class="px-2.5 py-1 rounded hover:bg-indigo-600 transition text-gray-300 font-semibold">0.75x</button>
                        <button onclick="setPlaybackRate(1.0)" class="px-2.5 py-1 rounded bg-indigo-600 text-white font-semibold" id="rate-1">1.0x</button>
                        <button onclick="setPlaybackRate(1.25)" class="px-2.5 py-1 rounded hover:bg-indigo-600 transition text-gray-300 font-semibold">1.25x</button>
                        <button onclick="setPlaybackRate(1.5)" class="px-2.5 py-1 rounded hover:bg-indigo-600 transition text-gray-300 font-semibold">1.5x</button>
                    </div>
                </div>

                <!-- Ovozni boshqarish tugmalari (Play/Pause) -->
                <div class="flex items-center gap-4">
                    <button onclick="toggleAudioPlayback()" id="play-pause-btn" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2.5 rounded-xl font-bold text-sm transition flex items-center gap-2 shadow-lg shadow-indigo-600/20">
                        ▶ Eshitishni boshlash / Pauza
                    </button>
                    <span id="audio-status" class="text-xs text-gray-400">Tayyor</span>
                </div>
            </div>

            <!-- Yashirin audio matn (AI yordamchi uchun saqlanadi) -->
            <div id="passage-content" class="hidden">{{ item.audio_text }}</div>

            <!-- AI Rejimi tugmasi -->
            <div>
                <button onclick="loadAIHelper('listening')" class="bg-purple-600 hover:bg-purple-500 text-white font-bold px-5 py-2.5 rounded-xl transition flex items-center gap-2 text-sm shadow-lg shadow-purple-600/20">
                    🤖 AI Rejimi (Lug'at va Maslahatlar)
                </button>
                <div id="ai-helper-box" class="hidden mt-4 p-5 bg-slate-950 border border-purple-500/30 rounded-xl text-gray-300 space-y-3">
                    <h4 class="text-purple-400 font-bold text-xs uppercase tracking-wider">AI Yordamchisi Tavsiyalari:</h4>
                    <div id="ai-helper-content" class="whitespace-pre-line leading-relaxed text-xs text-gray-300"></div>
                </div>
            </div>

            <!-- Savol va Javob kiritish maydoni -->
            <div class="space-y-3 pt-4 border-t border-gray-800">
                <label class="block font-bold text-gray-200 text-sm">Savol: {{ item.question }}</label>
                <input type="text" id="user-answer" placeholder="Javobingizni shu yerga yozing..." class="w-full bg-slate-950 border border-gray-800 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-emerald-500 transition">
            </div>

            <div class="flex flex-wrap gap-4 items-center pt-2">
                <button onclick="checkUserAnswer()" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 px-6 py-3 rounded-xl font-bold text-sm transition shadow-lg shadow-emerald-500/20">
                    Javobni tekshirish
                </button>
                <button onclick="toggleCorrectAnswer()" class="text-gray-400 hover:text-white text-xs underline transition">
                    To'g'ri javobni ko'rish
                </button>
            </div>

            <!-- Natija xabari -->
            <div id="result-feedback" class="hidden mt-4"></div>

            <!-- Yashirin to'g'ri javob -->
            <div id="correct-answer-box" class="hidden mt-4 p-4 bg-slate-950 border border-gray-800 rounded-xl text-xs text-gray-400">
                To'g'ri javob: <span class="text-emerald-400 font-bold">{{ item.correct_answer }}</span>
            </div>
        </div>
    </div>

    <script>
    // Browserning SpeechSynthesis (Matnni ovozga aylantirish) funksiyasi
    let synth = window.speechSynthesis;
    let utterance = null;
    let isPlaying = false;
    let currentRate = 1.0;

    function initSpeech() {
        const text = document.getElementById('passage-content').innerText;
        utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US'; // Ingliz tilida o'qiydi
        utterance.rate = currentRate;

        utterance.onend = function() {
            isPlaying = false;
            document.getElementById('play-pause-btn').innerText = "▶ Eshitishni boshlash / Pauza";
            document.getElementById('audio-status').innerText = "Tugadi";
        };
    }

    function toggleAudioPlayback() {
        if (!utterance) {
            initSpeech();
        }

        if (synth.speaking) {
            if (synth.paused) {
                synth.resume();
                isPlaying = true;
                document.getElementById('play-pause-btn').innerText = "⏸ Pauza";
                document.getElementById('audio-status').innerText = "Davom etmoqda...";
            } else {
                synth.pause();
                isPlaying = false;
                document.getElementById('play-pause-btn').innerText = "▶ Davom ettirish";
                document.getElementById('audio-status').innerText = "Pauza qilindi";
            }
        } else {
            synth.speak(utterance);
            isPlaying = true;
            document.getElementById('play-pause-btn').innerText = "⏸ Pauza";
            document.getElementById('audio-status').innerText = "O'qilmoqda...";
        }
    }

    function setPlaybackRate(rate) {
        currentRate = rate;
        if (utterance) {
            utterance.rate = currentRate;
        }
        // Tugmalar rangini o'zgartirish
        document.querySelectorAll('.bg-indigo-600').forEach(btn => {
            if(btn.id !== 'play-pause-btn') {
                btn.className = "px-2.5 py-1 rounded hover:bg-indigo-600 transition text-gray-300 font-semibold";
            }
        });
        event.target.className = "px-2.5 py-1 rounded bg-indigo-600 text-white font-semibold";
    }

    // Javobni tekshirish (Backenddagi AI tekshiruv API orqali)
    async function checkUserAnswer() {
        const userVal = document.getElementById('user-answer').value.trim();
        const feedbackDiv = document.getElementById('result-feedback');
        const itemId = {{ item.id }};

        feedbackDiv.classList.remove('hidden');
        if(userVal === "") {
            feedbackDiv.className = "mt-3 p-4 rounded-xl text-xs font-bold bg-yellow-500/10 text-yellow-400 border border-yellow-500/20";
            feedbackDiv.innerText = "Iltimos, avval javob yozing!";
            return;
        }

        feedbackDiv.className = "mt-3 p-4 rounded-xl text-xs font-bold bg-gray-800 text-gray-300 border border-gray-700";
        feedbackDiv.innerText = "AI javobingizni tahlil qilmoqda...";

        try {
            const response = await fetch('/api/check-listening', { // Agar API manzili boshqacha bo'lsa shunga moslang
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ item_id: itemId, user_answer: userVal })
            });
            const data = await response.json();

            if (response.ok) {
                if (data.is_correct) {
                    feedbackDiv.className = "mt-3 p-4 rounded-xl text-xs font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20";
                    feedbackDiv.innerText = "Ajoyib! Javobingiz to'g'ri 🎉 " + (data.comment ? "(" + data.comment + ")" : "");
                } else {
                    feedbackDiv.className = "mt-3 p-4 rounded-xl text-xs font-bold bg-red-500/10 text-red-400 border border-red-500/20";
                    feedbackDiv.innerText = "Afsuski, javob noto'g'ri. Qayta urinib ko'ring.";
                }
            } else {
                feedbackDiv.innerText = "Xatolik yuz berdi.";
            }
        } catch (err) {
            feedbackDiv.innerText = "Server bilan aloqa yo'q.";
        }
    }

    function toggleCorrectAnswer() {
        const box = document.getElementById('correct-answer-box');
        box.classList.toggle('hidden');
    }

    async function loadAIHelper(moduleType) {
        const box = document.getElementById('ai-helper-box');
        const contentDiv = document.getElementById('ai-helper-content');

        box.classList.remove('hidden');
        contentDiv.innerText = "AI kalit so'zlar va maslahatlarni tayyorlamoqda...";

        const passageText = document.getElementById('passage-content').innerText.trim();

        try {
            const response = await fetch('/api/ai-helper', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ module_type: moduleType, text_content: passageText })
            });
            const data = await response.json();
            if(response.ok) {
                contentDiv.innerText = data.ai_help;
            } else {
                contentDiv.innerText = "Xatolik yuz berdi.";
            }
        } catch(err) {
            contentDiv.innerText = "Server bilan aloqa yo'q.";
        }
    }
    </script>
</body>
</html>
