{% extends "base.html" %}
{% block content %}
<div class="max-w-3xl mx-auto space-y-6 pb-12">
    <!-- Yuqori qism / Orqaga qaytish -->
    <div class="flex justify-between items-center border-b border-stone-300/80 pb-4">
        <a href="/listening" class="text-amber-700 hover:text-amber-800 text-sm font-semibold transition">&larr; Listening ro'yxatiga qaytish</a>
        <span class="text-xs font-bold px-3 py-1 rounded-xl bg-amber-100 text-amber-800 border border-amber-200">Listening Item {{ item.id }}</span>
    </div>

    <div class="bg-[#FAF8F5]/80 backdrop-blur-md border border-stone-300/80 p-6 md:p-8 rounded-3xl shadow-xl space-y-6">
        <h1 class="text-2xl font-black text-stone-900">{{ item.title }}</h1>

        <!-- Audio pleer va Tezlik boshqaruvi -->
        <div class="bg-white p-6 rounded-2xl border border-stone-300/80 space-y-4 shadow-sm">
            <div class="flex items-center justify-between flex-wrap gap-2">
                <span class="text-sm font-bold text-amber-800">🎧 Ovozli matnni tinglash:</span>
                <!-- Tezlikni boshqarish tugmalari -->
                <div class="flex gap-1.5 bg-stone-100 p-1 rounded-xl border border-stone-200 text-xs">
                    <button onclick="setPlaybackRate(0.75)" class="px-2.5 py-1 rounded-lg hover:bg-stone-200 transition text-stone-700 font-bold">0.75x</button>
                    <button onclick="setPlaybackRate(1.0)" class="px-2.5 py-1 rounded-lg bg-amber-700 text-white font-bold shadow-sm" id="rate-1">1.0x</button>
                    <button onclick="setPlaybackRate(1.25)" class="px-2.5 py-1 rounded-lg hover:bg-stone-200 transition text-stone-700 font-bold">1.25x</button>
                    <button onclick="setPlaybackRate(1.5)" class="px-2.5 py-1 rounded-lg hover:bg-stone-200 transition text-stone-700 font-bold">1.5x</button>
                </div>
            </div>

            <!-- Ovozni boshqarish tugmalari (Play/Pause) -->
            <div class="flex items-center gap-4 flex-wrap">
                <button onclick="toggleAudioPlayback()" id="play-pause-btn" class="bg-amber-700 hover:bg-amber-800 text-white px-5 py-3 rounded-2xl font-bold text-sm transition flex items-center gap-2 shadow-md">
                    ▶ Eshitishni boshlash / Pauza
                </button>
                <span id="audio-status" class="text-xs font-semibold text-stone-500">Tayyor</span>
            </div>
        </div>

        <!-- Yashirin audio matn (AI yordamchi uchun saqlanadi) -->
        <div id="passage-content" class="hidden">{{ item.audio_text }}</div>

        <!-- AI Rejimi tugmasi -->
        <div>
            <button onclick="loadAIHelper('listening')" class="bg-stone-900 hover:bg-stone-800 text-white font-bold px-5 py-3 rounded-2xl transition flex items-center gap-2 text-sm shadow-md">
                🤖 AI Rejimi (Lug'at va Maslahatlar)
            </button>
            <div id="ai-helper-box" class="hidden mt-4 p-5 bg-white border border-amber-700/30 rounded-2xl text-stone-700 space-y-3 shadow-sm">
                <h4 class="text-amber-800 font-bold text-xs uppercase tracking-wider">AI Yordamchisi Tavsiyalari:</h4>
                <div id="ai-helper-content" class="whitespace-pre-line leading-relaxed text-xs text-stone-600"></div>
            </div>
        </div>

        <!-- Savol va Javob kiritish maydoni -->
        <div class="space-y-3 pt-4 border-t border-stone-300/60">
            <label class="block font-bold text-stone-900 text-sm">Savol: {{ item.question }}</label>
            <input type="text" id="user-answer" placeholder="Javobingizni shu yerga yozing..." class="w-full bg-white border border-stone-300 rounded-2xl px-4 py-3 text-stone-900 text-sm focus:outline-none focus:border-amber-700 transition">
        </div>

        <div class="flex flex-wrap gap-4 items-center pt-2">
            <button onclick="checkUserAnswer()" class="bg-stone-900 hover:bg-stone-800 text-white px-6 py-3 rounded-2xl font-bold text-sm transition shadow-md">
                Javobni tekshirish
            </button>
            <button onclick="toggleCorrectAnswer()" class="text-stone-500 hover:text-stone-900 text-xs font-semibold underline transition">
                To'g'ri javobni ko'rish
            </button>
        </div>

        <!-- Natija xabari -->
        <div id="result-feedback" class="hidden mt-4"></div>

        <!-- Yashirin to'g'ri javob -->
        <div id="correct-answer-box" class="hidden mt-4 p-4 bg-white border border-stone-300 rounded-2xl text-xs text-stone-600 shadow-sm">
            To'g'ri javob: <span class="text-amber-800 font-bold">{{ item.correct_answer }}</span>
        </div>
    </div>
</div>

<script>
// Browserning SpeechSynthesis (Matnni ovozga aylantirish) funksiyasi
let synth = window.speechSynthesis;
let utterance = null;
let isPlaying = false;
let currentRate = 1.0;

function initSpeech() {
    const text = document.getElementById('passage-content').innerText;
    utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'en-US'; // Ingliz tilida o'qiydi
    utterance.rate = currentRate;

    utterance.onend = function() {
        isPlaying = false;
        document.getElementById('play-pause-btn').innerText = "▶ Eshitishni boshlash / Pauza";
        document.getElementById('audio-status').innerText = "Tugadi";
    };
}

function toggleAudioPlayback() {
    if (!utterance) {
        initSpeech();
    }

    if (synth.speaking) {
        if (synth.paused) {
            synth.resume();
            isPlaying = true;
            document.getElementById('play-pause-btn').innerText = "⏸ Pauza";
            document.getElementById('audio-status').innerText = "Davom etmoqda...";
        } else {
            synth.pause();
            isPlaying = false;
            document.getElementById('play-pause-btn').innerText = "▶ Davom ettirish";
            document.getElementById('audio-status').innerText = "Pauza qilindi";
        }
    } else {
        synth.speak(utterance);
        isPlaying = true;
        document.getElementById('play-pause-btn').innerText = "⏸ Pauza";
        document.getElementById('audio-status').innerText = "O'qilmoqda...";
    }
}

function setPlaybackRate(rate) {
    currentRate = rate;
    if (utterance) {
        utterance.rate = currentRate;
    }
    // Tugmalar rangini o'zgartirish
    document.querySelectorAll('.bg-amber-700').forEach(btn => {
        if(btn.id !== 'play-pause-btn') {
            btn.className = "px-2.5 py-1 rounded-lg hover:bg-stone-200 transition text-stone-700 font-bold";
        }
    });
    event.target.className = "px-2.5 py-1 rounded-lg bg-amber-700 text-white font-bold shadow-sm";
}

// Javobni tekshirish (Backenddagi AI tekshiruv API orqali)
async function checkUserAnswer() {
    const userVal = document.getElementById('user-answer').value.trim();
    const feedbackDiv = document.getElementById('result-feedback');
    const itemId = {{ item.id }};

    feedbackDiv.classList.remove('hidden');
    if(userVal === "") {
        feedbackDiv.className = "mt-3 p-4 rounded-2xl text-xs font-bold bg-amber-100 text-amber-800 border border-amber-200 shadow-sm";
        feedbackDiv.innerText = "Iltimos, avval javob yozing!";
        return;
    }

    feedbackDiv.className = "mt-3 p-4 rounded-2xl text-xs font-bold bg-white text-stone-700 border border-stone-300 shadow-sm";
    feedbackDiv.innerText = "AI javobingizni tahlil qilmoqda...";

    try {
        const response = await fetch('/api/check-listening', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ item_id: itemId, user_answer: userVal })
        });
        const data = await response.json();

        if (response.ok) {
            if (data.is_correct) {
                feedbackDiv.className = "mt-3 p-4 rounded-2xl text-xs font-bold bg-emerald-100 text-emerald-800 border border-emerald-200 shadow-sm";
                feedbackDiv.innerText = "Ajoyib! Javobingiz to'g'ri 🎉 " + (data.comment ? "(" + data.comment + ")" : "");
            } else {
                feedbackDiv.className = "mt-3 p-4 rounded-2xl text-xs font-bold bg-rose-100 text-rose-800 border border-rose-200 shadow-sm";
                feedbackDiv.innerText = "Afsuski, javob noto'g'ri. Qayta urinib ko'ring.";
            }
        } else {
            feedbackDiv.innerText = "Xatolik yuz berdi.";
        }
    } catch (err) {
        feedbackDiv.innerText = "Server bilan aloqa yo'q.";
    }
}

function toggleCorrectAnswer() {
    const box = document.getElementById('correct-answer-box');
    box.classList.toggle('hidden');
}

async function loadAIHelper(moduleType) {
    const box = document.getElementById('ai-helper-box');
    const contentDiv = document.getElementById('ai-helper-content');

    box.classList.remove('hidden');
    contentDiv.innerText = "AI kalit so'zlar va maslahatlarni tayyorlamoqda...";

    const passageText = document.getElementById('passage-content').innerText.trim();

    try {
        const response = await fetch('/api/ai-helper', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ module_type: moduleType, text_content: passageText })
        });
        const data = await response.json();
        if(response.ok) {
            contentDiv.innerText = data.ai_help;
        } else {
            contentDiv.innerText = "Xatolik yuz berdi.";
        }
    } catch(err) {
        contentDiv.innerText = "Server bilan aloqa yo'q.";
    }
}
</script>
{% endblock %}
