{% extends "base.html" %}
{% block content %}
<div style="background-color: #FAF8F5;" class="max-w-md mx-auto mt-12 border border-stone-300/80 p-8 rounded-3xl shadow-xl space-y-6">
    <div class="text-center space-y-2">
        <h1 class="text-2xl font-black text-stone-900 tracking-tight">Tizimga kirish</h1>
        <p class="text-xs text-stone-500">Profilingizga kirish uchun ma'lumotlarni kiriting</p>
    </div>

    <form action="/login" method="POST" class="space-y-4">
        <div>
            <label class="block text-xs font-bold text-stone-600 uppercase mb-1">Foydalanuvchi nomi (Username)</label>
            <input type="text" name="username" placeholder="Foydalanuvchi nomi" required style="background-color: #FFFFFF; color: #1c1917;" class="w-full border border-stone-300 rounded-2xl px-4 py-3 text-sm placeholder-stone-400 focus:outline-none focus:border-amber-700 transition">
        </div>
        <div>
            <label class="block text-xs font-bold text-stone-600 uppercase mb-1">Parol</label>
            <input type="password" name="password" placeholder="••••••••" required style="background-color: #FFFFFF; color: #1c1917;" class="w-full border border-stone-300 rounded-2xl px-4 py-3 text-sm placeholder-stone-400 focus:outline-none focus:border-amber-700 transition">
        </div>

        <button type="submit" class="w-full bg-stone-900 hover:bg-stone-800 text-white font-bold py-3.5 rounded-2xl text-sm transition shadow-md cursor-pointer mt-2">
            Kirish
        </button>
    </form>

    <p class="text-center text-xs text-stone-600">
        Hisobingiz yo'qmi? <a href="/register" class="text-amber-700 font-bold hover:underline">Ro'yxatdan o'tish</a>
    </p>
</div>
{% endblock %}
