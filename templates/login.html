{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto mt-16 bg-slate-900/50 backdrop-blur-xl border border-white/10 p-8 rounded-3xl shadow-2xl space-y-6">
    <div class="text-center space-y-2">
        <h1 class="text-2xl font-black text-white">Tizimga kirish</h1>
        <p class="text-xs text-gray-400">Profilingizga kirish uchun ma'lumotlarni kiriting</p>
    </div>

    <form action="/login" method="POST" class="space-y-4">
        <div>
            <label class="block text-xs font-semibold text-gray-300 mb-1">Foydalanuvchi nomi (Username)</label>
            <input type="text" name="username" value="nishonov_273" required class="w-full bg-slate-950/60 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500 transition">
        </div>
        <div>
            <label class="block text-xs font-semibold text-gray-300 mb-1">Parol</label>
            <input type="password" name="password" required class="w-full bg-slate-950/60 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500 transition">
        </div>
        
        <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3.5 rounded-xl text-sm transition shadow-lg shadow-emerald-500/20">
            Kirish
        </button>
    </form>

    <p class="text-center text-xs text-gray-400">
        Hisobingiz yo'qmi? <a href="/register" class="text-emerald-400 font-semibold hover:underline">Ro'yxatdan o'tish</a>
    </p>
</div>
{% endblock %}
